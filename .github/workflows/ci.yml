name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: themes/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: themes/vscode/package-lock.json

      - run: npm ci

      - name: Build and test
        run: npm test

      # Fails when any committed output (VS Code, Zed, Chrome, swatches) is stale or hand-edited.
      - name: Check generated files are up to date
        run: |
          npm run generate
          git diff --stat
          test -z "$(git status --porcelain --untracked-files=all)"
